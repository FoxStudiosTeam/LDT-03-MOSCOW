name: ⚡ Flutter App 🟢

on:
  push:

jobs:
  lint-and-test:
    runs-on: self-hosted
    defaults:
      run:
        working-directory: ./frontend
    name: Flutter Lint & Test
    steps:
      - uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'

      - name: Install dependencies
        run: flutter pub get

      - name: Run lint
        run: flutter analyze

      - name: Run tests
        run: flutter test

  build-and-deploy:
    needs: lint-and-test
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: FoxStudiosTeam/Deployment/.github/workflows/build-image.yml@v0.0.29
    with:
      image-name: dbj/mobile
      namespace: solution
      workdir: './mobile_flutter'
      context: './'
      manifest-files-path-root: ./mobile_flutter/.deployment
      version_path: ./mobile_flutter/.deployment/version.toml
      service-name: mobile_flutter
      shared_cache: /mnt/shared
      shared_cache_key: mobile_flutter
      restart-deployment: true
    secrets:
      DOCKER_HOST: ${{ secrets.DOCKER_HOST }}
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      KUBECONFIG: ${{ secrets.KUBE_CONFIG_DATA }}
      SSH_KEY: ${{ secrets.RUST_SSH_KEY }}
